<style>

  /* === PAGE HEADER === */
  .itin-header {
    background: var(--navy);
    padding: 48px 24px 0;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .itin-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(26,123,184,0.15) 0%, transparent 60%);
    pointer-events: none;
  }

  .itin-header-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--azure-light);
    margin-bottom: 8px;
  }

  .itin-header h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    color: var(--sand);
    margin-bottom: 6px;
  }

  .itin-header h1 span { color: var(--gold); }

  .itin-header-sub {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--azure-light);
    margin-bottom: 32px;
  }

  /* === DAY TABS === */
  .day-tabs-wrap {
    background: var(--navy);
    position: sticky;
    top: 64px;
    z-index: 100;
    border-bottom: 2px solid rgba(255,255,255,0.08);
  }

  .day-tabs {
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .day-tabs::-webkit-scrollbar { display: none; }

  .day-tab {
    flex-shrink: 0;
    padding: 14px 20px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    text-align: center;
    min-width: 80px;
  }

  .day-tab:hover { background: rgba(255,255,255,0.04); }

  .day-tab.active {
    border-bottom-color: var(--gold);
  }

  .day-tab-date {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--azure-light);
    text-transform: uppercase;
  }

  .day-tab.active .day-tab-date { color: var(--gold); }

  .day-tab-label {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }

  .day-tab.active .day-tab-label { color: var(--sand); }

  .day-tab-icon { font-size: 18px; margin-bottom: 2px; }

  /* === CONTENT AREA === */
  .itin-content {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* === DAY PANEL === */
  .day-panel { display: none; }
  .day-panel.active { display: block; animation: fadeUp 0.4s ease both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .day-panel-header {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 2px solid var(--sand-dark);
  }

  .day-number-big {
    font-family: 'Pacifico', cursive;
    font-size: 64px;
    line-height: 1;
    color: var(--azure-light);
    flex-shrink: 0;
    min-width: 80px;
    text-align: center;
  }

  .day-panel-info {}

  .day-panel-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--azure);
    margin-bottom: 4px;
  }

  .day-panel-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .day-panel-date {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .day-panel-note {
    background: var(--azure-light);
    border-left: 3px solid var(--azure);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    color: var(--navy);
    font-weight: 700;
    margin-top: 8px;
    display: inline-block;
  }

  /* === TIMELINE === */
  .timeline {
    border-left: 2px solid var(--sand-dark);
    margin-left: 16px;
    padding-left: 28px;
  }

  .event {
    position: relative;
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px dashed var(--sand-dark);
  }

  .event:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .event::before {
    content: '';
    position: absolute;
    left: -36px;
    top: 6px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--azure);
    border: 3px solid var(--white);
    box-shadow: 0 0 0 2px var(--azure);
  }

  .event.terracotta::before {
    background: var(--terracotta);
    box-shadow: 0 0 0 2px var(--terracotta);
  }

  .event.gold::before {
    background: var(--gold-dark);
    box-shadow: 0 0 0 2px var(--gold-dark);
  }

  .event-time {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--azure);
    margin-bottom: 4px;
  }

  .event.terracotta .event-time { color: var(--terracotta); }
  .event.gold .event-time { color: var(--gold-dark); }

  .event-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .event-detail {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.8;
  }

  .event-detail a {
    color: var(--azure);
    text-decoration: none;
    border-bottom: 1px dotted var(--azure);
  }

  .event-detail a:hover { color: var(--terracotta); border-bottom-color: var(--terracotta); }

  .event-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  /* === LOCATION PILL === */
  .location-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--navy);
    color: var(--sand);
    padding: 6px 14px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  /* === VOYAGE BADGE === */
  .voyage-badge {
    background: linear-gradient(135deg, var(--azure), var(--navy));
    color: var(--sand);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .day-panel-header { flex-direction: column; gap: 8px; }
    .day-number-big { font-size: 48px; min-width: auto; }
    .day-tab { min-width: 70px; padding: 12px 12px; }
    .day-tab-label { font-size: 10px; }
  }
</style>

      <div class="event ${e.color || 'azure'}">
        <div class="event-time">${e.time}</div>
        <div class="event-title">${e.title}</div>
        <div class="event-detail">${e.detail.replace(/\n/g, '<br>')}${e.link ? ` <a href="${e.link}" target="_blank">↗ website</a>` : ''}</div>
        ${e.badge ? `<div class="event-badges"><span class="badge badge-${e.badge}">${e.badgeText}</span></div>` : ''}
      </div>
    `).join('');

    const panel = document.createElement('div');
    panel.className = `day-panel${i === 0 ? ' active' : ''}`;
    panel.id = `panel-${i}`;
    panel.innerHTML = `
      <div class="day-panel-header">
        <div class="day-number-big">${day.day}</div>
        <div class="day-panel-info">
          <div class="day-panel-label">${i < 2 ? 'Pre-Voyage · La Cocumella' : 'Aboard M/Y R23'}</div>
          <div class="day-panel-title">${day.title}</div>
          <div class="day-panel-date">${day.fullDate}</div>
          <div style="margin-top:6px"><span class="location-pill">${day.location}</span></div>
          ${day.note ? `<div class="day-panel-note">📌 ${day.note}</div>` : ''}
        </div>
      </div>
      <div class="timeline">${eventsHTML}</div>
    `;
    panelsEl.appendChild(panel);
  });

  window.switchDay = function(index) {
    document.querySelectorAll('.day-tab').forEach((t, i) => t.classList.toggle('active', i === index));
    document.querySelectorAll('.day-panel').forEach((p, i) => p.classList.toggle('active', i === index));
    // Scroll tabs into view
    const tabs = document.querySelectorAll('.day-tab');
    tabs[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  };
</script>
</body>
</html>

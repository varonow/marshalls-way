<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/nav.css">
<style>

  /* PAGE HEADER */
  .itin-header {
    background: var(--navy);
    padding: 52px 24px 0;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .itin-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(26,123,184,0.12) 0%, transparent 60%);
    pointer-events: none;
  }

  .itin-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--azure-light);
    margin-bottom: 10px;
  }

  .itin-header h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(2rem, 5vw, 3.2rem);
    color: var(--sand);
    margin-bottom: 8px;
  }

  .itin-header h1 span { color: var(--gold); }

  .itin-header-sub {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 0;
  }

  /* DAY TABS */
  .day-tabs-wrap {
    background: var(--navy);
    position: sticky;
    top: 64px;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .day-tabs {
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 8px;
  }

  .day-tabs::-webkit-scrollbar { display: none; }

  .day-tab {
    flex-shrink: 0;
    padding: 16px 18px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    text-align: center;
    min-width: 76px;
  }

  .day-tab:hover { background: rgba(255,255,255,0.03); }

  .day-tab.active { border-bottom-color: var(--gold); }

  .day-tab-num {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .day-tab.active .day-tab-num { color: var(--gold); }

  .day-tab-name {
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.45);
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  .day-tab.active .day-tab-name { color: var(--sand); }

  /* CONTENT */
  .itin-content {
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 100px;
  }

  /* DAY PANEL */
  .day-panel { display: none; }
  .day-panel.active {
    display: block;
    animation: fadeUp 0.35s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Day title block */
  .day-title-block {
    margin-bottom: 40px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--sand-dark);
  }

  .day-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--azure);
    margin-bottom: 6px;
  }

  .day-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 700;
    color: var(--navy);
    line-height: 1.1;
    margin-bottom: 6px;
  }

  .day-date {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .day-location {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--navy);
    color: var(--sand);
    padding: 6px 16px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .day-highlight {
    margin-top: 14px;
    background: linear-gradient(135deg, #FEF3E2, #FFF8F0);
    border-left: 3px solid var(--terracotta);
    border-radius: 0 8px 8px 0;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--navy);
    line-height: 1.6;
    font-style: italic;
  }

  /* Timeline */
  .timeline {
    border-left: 1px solid var(--sand-dark);
    margin-left: 12px;
    padding-left: 32px;
  }

  .event {
    position: relative;
    margin-bottom: 32px;
  }

  .event:last-child { margin-bottom: 0; }

  .event::before {
    content: '';
    position: absolute;
    left: -38px;
    top: 8px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--sand-dark);
    border: 2px solid var(--azure);
  }

  .event.accent::before { border-color: var(--terracotta); }
  .event.gold::before { border-color: var(--gold-dark); background: var(--gold-dark); }

  .event-time {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .event.accent .event-time { color: var(--terracotta); }
  .event.gold .event-time { color: var(--gold-dark); }

  .event-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .event-desc {
    font-size: 14px;
    color: #4A5A6A;
    line-height: 1.85;
  }

  .event-desc a {
    color: var(--azure);
    text-decoration: none;
    font-weight: 700;
  }

  .event-desc a:hover { color: var(--terracotta); }

  .event-divider {
    height: 1px;
    background: linear-gradient(90deg, var(--sand-dark), transparent);
    margin: 32px 0;
  }

  @media (max-width: 600px) {
    .day-tab { min-width: 66px; padding: 14px 10px 12px; }
    .day-tab-name { font-size: 10px; }
    .itin-content { padding: 32px 20px 80px; }
  }
</style>
</head>

  DAYS.forEach((day, i) => {
    const tab = document.createElement('div');
    tab.className = `day-tab${i === 0 ? ' active' : ''}`;
    tab.innerHTML = `
      <div class="day-tab-num">${day.tab.num}</div>
      <div class="day-tab-name">${day.tab.name}</div>
    `;
    tab.onclick = () => switchDay(i);
    tabsEl.appendChild(tab);
  });

  // Build panels
  const panelsEl = document.getElementById('dayPanels');
  DAYS.forEach((day, i) => {
    const eventsHTML = day.events.map(e => `
      <div class="event ${e.style === 'accent' ? 'accent' : e.style === 'gold' ? 'gold' : ''}">
        <div class="event-time">${e.time}</div>
        <div class="event-title">${e.title}</div>
        <div class="event-desc">${e.desc}${e.link ? ` <a href="${e.link}" target="_blank">Learn more →</a>` : ''}</div>
      </div>
    `).join('<div class="event-divider"></div>');

    const panel = document.createElement('div');
    panel.className = `day-panel${i === 0 ? ' active' : ''}`;
    panel.innerHTML = `
      <div class="day-title-block">
        <div class="day-label">${day.label}</div>
        <div class="day-title">${day.title}</div>
        <div class="day-date">${day.date}</div>
        <span class="day-location">${day.location}</span>
        ${day.highlight ? `<div class="day-highlight">${day.highlight}</div>` : ''}
      </div>
      <div class="timeline">${eventsHTML}</div>
    `;
    panelsEl.appendChild(panel);
  });

  window.switchDay = function(index) {
    document.querySelectorAll('.day-tab').forEach((t, i) => t.classList.toggle('active', i === index));
    document.querySelectorAll('.day-panel').forEach((p, i) => p.classList.toggle('active', i === index));
    document.querySelectorAll('.day-tab')[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
</script>
</body>
</html>

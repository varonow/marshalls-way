<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marshall's Way — Enter</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    background: var(--sand);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .bg-dots { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .dot {
    position: absolute; border-radius: 50%; opacity: 0;
    animation: twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; } 50% { opacity: var(--opa); }
  }
  .bg-waves { position: fixed; bottom: 0; left: 0; right: 0; height: 160px; overflow: hidden; pointer-events: none; }
  .bg-waves svg { width: 100%; height: 100%; }

  .login-container {
    width: 100%; max-width: 480px; padding: 24px;
    text-align: center; position: relative; z-index: 10;
  }
  .login-logo {
    width: 220px; height: auto; margin-bottom: 12px;
    filter: drop-shadow(0 6px 20px rgba(26,51,80,0.15));
    animation: fadeUp 0.8s ease 0.1s both;
  }
  .login-tagline-1 {
    font-family: 'Lato', sans-serif; font-weight: 700; font-size: 11px;
    letter-spacing: 5px; text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 4px; animation: fadeUp 0.8s ease 0.25s both;
  }
  .login-tagline-2 {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 24px; color: var(--navy); margin-bottom: 36px;
    animation: fadeUp 0.8s ease 0.35s both;
  }
  .login-card {
    background: var(--white); border: 1px solid var(--sand-dark);
    border-top: 4px solid var(--terracotta); border-radius: 16px;
    padding: 36px 32px; box-shadow: 0 8px 40px rgba(26,51,80,0.1);
    animation: fadeUp 0.8s ease 0.45s both;
  }
  .login-card h2 { color: var(--navy); font-size: 22px; font-style: italic; margin-bottom: 6px; }
  .login-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }

  .form-group { margin-bottom: 14px; text-align: left; }
  .form-label {
    display: block; font-size: 10px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 6px;
  }
  .login-input {
    width: 100%; padding: 14px 18px;
    border: 2px solid var(--sand-dark); border-radius: 50px;
    background: var(--sand); color: var(--navy);
    font-size: 15px; outline: none;
    font-family: 'Lato', sans-serif; transition: border-color 0.2s;
  }
  .login-input:focus { border-color: var(--azure); }
  .login-input.error { border-color: var(--terracotta); }

  .login-btn {
    width: 100%; padding: 16px; background: var(--terracotta); color: var(--white);
    border: none; border-radius: 50px; font-family: 'Lato', sans-serif; font-weight: 700;
    font-size: 13px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer;
    transition: all 0.2s; box-shadow: 0 4px 20px rgba(196,98,45,0.3); margin-top: 8px;
  }
  .login-btn:hover { background: #B05020; transform: translateY(-2px); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .error-msg {
    color: var(--terracotta); font-size: 13px;
    margin-top: 12px; display: none; text-align: center;
  }

  .forgot-link {
    display: block; margin-top: 16px; font-size: 12px;
    color: var(--text-muted); cursor: pointer;
    text-decoration: underline;
  }
  .forgot-link:hover { color: var(--azure); }

  .success-msg {
    color: #2E7D52; font-size: 13px;
    margin-top: 12px; display: none; text-align: center;
  }

  .login-footer {
    margin-top: 24px; color: var(--text-muted); font-size: 10px;
    letter-spacing: 3px; animation: fadeIn 1s ease 1s both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
</style>
</head>
<body>

<div class="bg-dots" id="dots"></div>
<div class="bg-waves">
  <svg viewBox="0 0 1200 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 60 Q150 20 300 60 Q450 100 600 60 Q750 20 900 60 Q1050 100 1200 60 L1200 160 L0 160 Z" fill="rgba(26,123,184,0.12)"/>
    <path d="M0 90 Q200 55 400 90 Q600 125 800 90 Q1000 55 1200 90 L1200 160 L0 160 Z" fill="rgba(26,123,184,0.1)"/>
    <path d="M0 115 Q300 90 600 115 Q900 140 1200 115 L1200 160 L0 160 Z" fill="rgba(26,51,80,0.06)"/>
  </svg>
</div>

<div class="login-container">
  <img src="images/logo.png" alt="Marshall's Way" class="login-logo">
  <p class="login-tagline-1">Amalfi Coast · July 2026</p>
  <p class="login-tagline-2">And now, the trip is near...</p>

  <div class="login-card">

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <h2>Welcome, Family</h2>
      <p>Sign in to join the voyage</p>

      <div class="form-group">
        <label class="form-label" for="emailInput">Email</label>
        <input type="email" class="login-input" id="emailInput" placeholder="your@email.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="passwordInput">Password</label>
        <input type="password" class="login-input" id="passwordInput" placeholder="Your password" autocomplete="current-password">
      </div>

      <button class="login-btn" id="loginBtn" onclick="handleLogin()">SET SAIL →</button>
      <p class="error-msg" id="errorMsg"></p>
      <a class="forgot-link" onclick="showForgotForm()">Forgot your password?</a>
    </div>

    <!-- FORGOT PASSWORD FORM -->
    <div id="forgotForm" style="display:none;">
      <h2>Reset Password</h2>
      <p>Enter your email and we'll send you a reset link</p>
      <div class="form-group">
        <label class="form-label" for="resetEmail">Email</label>
        <input type="email" class="login-input" id="resetEmail" placeholder="your@email.com">
      </div>
      <button class="login-btn" onclick="handleReset()">SEND RESET LINK</button>
      <p class="success-msg" id="successMsg">Reset link sent! Check your email.</p>
      <a class="forgot-link" onclick="showLoginForm()">Back to login</a>
    </div>

  </div>
  <p class="login-footer">MARSHALL'S WAY · AMALFI COAST · JULY 2026</p>
</div>

<script type="module">
  import { db, signIn, getSession, getCurrentUser } from './js/supabase.js';

  // Redirect if already logged in
  const session = await getSession();
  if (session && getCurrentUser()) {
    window.location.href = 'home.html';
  }

  // Animated dots
  const dotsContainer = document.getElementById('dots');
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    const size = 2 + Math.random() * 4;
    d.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*85}%;background:${Math.random()>.5?'#C9A830':'#1A7BB8'};--dur:${3+Math.random()*5}s;--delay:${Math.random()*5}s;--opa:${0.12+Math.random()*0.18};`;
    dotsContainer.appendChild(d);
  }

  // Allow Enter key
  document.getElementById('passwordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });

  window.handleLogin = async function() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    if (!email || !password) {
      errorMsg.textContent = 'Please enter your email and password.';
      errorMsg.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'SIGNING IN...';
    errorMsg.style.display = 'none';

    try {
      await signIn(email, password);
      window.location.href = 'home.html';
    } catch (err) {
      errorMsg.textContent = 'Incorrect email or password — try again!';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SET SAIL →';
    }
  };

  window.handleReset = async function() {
    const email = document.getElementById('resetEmail').value.trim();
    const successMsg = document.getElementById('successMsg');
    if (!email) return;
    await db.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://aronow.tours/index.html'
    });
    successMsg.style.display = 'block';
  };

  window.showForgotForm = function() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('forgotForm').style.display = 'block';
  };

  window.showLoginForm = function() {
    document.getElementById('forgotForm').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
  };
</script>
</body>
</html>
